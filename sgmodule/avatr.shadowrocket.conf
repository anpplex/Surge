#!name=阿维塔签到
#!desc=打开一次阿维塔 App 抓取凭证。loginToken 约 24 小时，refreshToken 约 30 天。不足 6 小时自动续期，每天 8:05–21:40 随机签到，22:17 补签。

[Script]
阿维塔续期抓取 = type=http-request,pattern=^https?:\/\/appserver-view\.avatr\.com\/v6\/base-view\/auth\/getNewToken,script-path=https://raw.githubusercontent.com/anpplex/Surge/main/Script/avatr_surge.js,requires-body=1,timeout=10,argument=mode=capture
阿维塔抓取 = type=http-request,pattern=^https?:\/\/(?:appserver-view\.avatr\.com\/app\/user\/getUserInfo|m\.avatr\.com\/api\/(?:v6\/signIn\/|app\/user\/)),script-path=https://raw.githubusercontent.com/anpplex/Surge/main/Script/avatr_surge.js,requires-body=0,timeout=10,argument=mode=capture
阿维塔登录响应 = type=http-response,pattern=^https?:\/\/(?:appserver-view|m)\.avatr\.com\/(?:api\/auth\/.*(login|token)|v6\/base-view\/auth\/getNewToken),script-path=https://raw.githubusercontent.com/anpplex/Surge/main/Script/avatr_surge.js,requires-body=1,timeout=10,argument=mode=response
阿维塔签到 = type=cron,cronexp="7,33,51 8-21 * * *",script-path=https://raw.githubusercontent.com/anpplex/Surge/main/Script/avatr_surge.js,timeout=30,argument=mode=cron
阿维塔补签 = type=cron,cronexp="17 22 * * *",script-path=https://raw.githubusercontent.com/anpplex/Surge/main/Script/avatr_surge.js,timeout=30,argument=mode=catchup
阿维塔立即签到 = type=generic,script-path=https://raw.githubusercontent.com/anpplex/Surge/main/Script/avatr_surge.js,timeout=30,argument=mode=now

[MITM]
hostname = appserver-view.avatr.com, m.avatr.com
